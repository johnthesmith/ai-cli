# AI util config file
application:
  # Log settings
  log:
    file: ~/.local/share/ai/%profile%/log.txt
    enabled: true
  # AI application
  ai:
    # Provider id 
    #  supported
    #    github
    provider: github
    # Prompt template file
    prompt: ~/.config/ai/%profile%/prompt.txt
    # Chat file. This chat contins chat id
    chat-file: ~/.local/share/ai/%profile%/chat.txt
    # History file
    history: ~/.local/share/ai/%profile%/history/
    # Buffer path
    buffers: ~/.local/share/ai/%profile%/buffer
    params:
      api: https://models.github.ai/inference/chat/completions
      # deepseek/deepseek-v3-0324
      # deepseek/deepseek-r1-0528
      # openai/gpt-4.1
      # openai/gpt-4.1-mini
      model: openai/gpt-4.1
      token: ~/.config/ai/%profile%/token.txt

    # Optional proxy settings
    # proxy: socks5://127.0.0.1:1080

    # Output destinations for AI response fields (command, out, buffer)
    # Recommended to use only:
    #   - BusyBox built-ins: tee, cat, printf, etc.
    #   - ai built-in commands: ai --write-buffer, ai --tiocsti
    # Each field can be:
    #   - omitted: use default behavior stdout
    #   - string: command to execute (receives data via stdin)
    #
    # Examples:
    #
    # TTY input (inject into terminal for user input emuulation):
    #  `xdotool type --clearmodifiers --file -`   X11
    #  `ydotool type --file -`                    Wayland
    #  `ai --tiocsti`                             for ssh
    #     Requires `sudo sysctl -w dev.tty.legacy_tiocsti=1` on modern kernels.
    #     Disabled by default due to security risks 
    #     Only use in trusted environments.
    #
    # Clipboard:
    #  `xclip -selection clipboard"               X11
    #  `wl-copy`                                  Wayland
    #  `pbcopy`                                   macOS
    #
    # File output:
    #  `cat && echo`
    #  `ai --write-buffer`
    #
    # Multiple actions (using tee):
    #  `tee >(ai --write-buffer) | xclip -selection clipboard`
    destination:
      # Pipeline for command processing
      command: "xdotool type --clearmodifiers --file -"
      # Pipeline for information out processing
      out: "cat && echo"
      # Pipeline for buffer processing
      buffer: "tee >(ai --write-buffer) | xclip -selection clipboard"




