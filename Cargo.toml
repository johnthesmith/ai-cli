[package]
name = "ai"
version = "0.1.10"
edition = "2021"
license = "MIT"
authors = ["Still Swamp <still@itserv.ru>"]
description = "CLI utility for embedding AI into bash pipelines"
repository = "https://github.com/johnthesmith/ai-cli"

[dependencies]
#core = { path = "../../lib/core" }
core = { git = "https://github.com/johnthesmith/rust-lib-core.git", branch = "main" }
reqwest = { version = "0.12", features = ["json", "blocking", "socks"] }
serde_json = "1.0"
regex = "1.10"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
