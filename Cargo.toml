[package]
name = "ai"
version = "1.0.0"
edition = "2024"

[dependencies]
#core = { path = "../../lib/core" }
core = { git = "https://github.com/johnthesmith/rust-lib-core.git", branch = "main" }
reqwest = { version = "0.12", features = ["json", "blocking", "socks"] }
serde_json = "1.0"
enigo = "0.2.0"
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
